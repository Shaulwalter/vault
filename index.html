function activateDemoMode(){var tr=S.P.filter(function(a){if(a.type==="stock"||a.type==="option")return true;if(a.type==="crypto"){var c=calc(a);return c.g>=100}return false});if(tr.length<=3)S.demoIds=tr.map(function(a){return a.id});else{var sh=tr.slice().sort(function(){return Math.random()-.5});S.demoIds=sh.slice(0,3).map(function(a){return a.id})}S.demoQty={};for(var i=0;i<S.demoIds.length;i++){var a=S.P.find(function(x){return x.id===S.demoIds[i]});if(!a)continue;S.demoQty[a.id]=a.type==="crypto"?+(Math.random()*10+.5).toFixed(4):Math.floor(Math.random()*450+10)}}

function applyPayload(d){if(!d||!d.portfolio)return false;S.P=d.portfolio;S.txns=Array.isArray(d.txns)?d.txns:[];if(d.prices)S.prices=d.prices;if(d.fxHist)S.fxHist=d.fxHist;if(d.fhKey)S.fhKey=d.fhKey;if(d.avKey)S.avKey=d.avKey;if(d.tdKey)S.tdKey=d.tdKey;if(d.dC)S.dC=d.dC;if(d.isDark!==undefined)S.isDark=d.isDark;if(d.track)S.track=d.track;if(d.cLocs)S.cLocs=d.cLocs;if(d.snapshots)snapshots=d.snapshots;if(S.dC==="GBP")S.dC="USD";S.P.forEach(function(a){if(a.currency==="GBP")a.currency="USD"});return true}

function saveSnaps(){var j=JSON.stringify(snapshots.slice(-365));if(useLS){try{localStorage.setItem(SNAP_KEY,j)}catch(e){}}else{try{window.storage.set(SNAP_KEY,j)}catch(e){}}}

async function fetchFH(sym){if(!S.fhKey)return null;try{var r=await fetch("https://finnhub.io/api/v1/quote?symbol="+encodeURIComponent(sym)+"&token="+S.fhKey);apiSt.fh.calls++;apiSt.fh.last=Date.now();if(!r.ok){apiSt.fh.ok=false;return null}var d=await r.json();if(d&&typeof d.c==="number"&&d.c>0){apiSt.fh.ok=true;return{price:d.c,pc:d.pc||d.c,src:"FH"}}}catch(e){apiSt.fh.ok=false}return null}
async function fetchTDQuote(sym){if(!S.tdKey)return null;try{var r=await fetch("https://api.twelvedata.com/quote?symbol="+encodeURIComponent(sym)+"&apikey="+S.tdKey);apiSt.td.calls++;apiSt.td.last=Date.now();if(!r.ok){apiSt.td.ok=false;return null}var d=await r.json();if(d.status==="error"||!d.close){apiSt.td.ok=false;return null}var cp2=parseFloat(d.close);if(!(cp2>0)){apiSt.td.ok=false;return null}apiSt.td.ok=true;return{price:cp2,pc:d.previous_close?parseFloat(d.previous_close):cp2,src:"TD"}}catch(e){apiSt.td.ok=false}return null}

async function refreshPrices(){await fetchXR();var sm={};S.P.forEach(function(a){if(a.type==="stock"||a.type==="option"||a.type==="crypto"){var k=a.symbol.toUpperCase();if(!sm[k])sm[k]=a.type==="option"?"stock":a.type}});var ok=0,fl=0,ks=Object.keys(sm);for(var i=0;i<ks.length;i++){var sym=ks[i];var res=sm[sym]==="crypto"?await fetchCG(sym):await fetchQuote(sym);if(res){S.prices[sym]={price:res.price,pc:res.pc||null,ch24:res.ch24||null,src:res.src,t:Date.now()};ok++}else fl++;if(i<ks.length-1)await delay(150)}takeSnap();save()}

function calc(a){var g=0,n=0,tx=0,cp=null,src="",pc=null,ch=null;var pd=S.prices[a.symbol?a.symbol.toUpperCase():""];if(a.type==="stock"){cp=(pd&&pd.price)||a.manualPrice||0;src=(pd&&pd.src)||"-";pc=pd?pd.pc:null;g=cp*a.quantity;tx=a.alreadyNet?0:g*(a.taxPercent/100);n=g-tx}else if(a.type==="option"){cp=(pd&&pd.price)||a.manualPrice||0;src=(pd&&pd.src)||"-";pc=pd?pd.pc:null;g=Math.max(0,cp-a.exercisePrice)*a.quantity;tx=a.alreadyNet?0:g*(a.taxPercent/100);n=g-tx}else if(a.type==="crypto"){cp=(pd&&pd.price)||a.manualPrice||0;src=(pd&&pd.src)||"-";ch=pd?pd.ch24:null;g=cp*a.quantity;tx=a.alreadyNet?0:g*((a.taxPercent||0)/100);n=g-tx}else if(a.type==="savings"){var rt=(a.interestRate||0)/100,mt=new Date(a.maturityDate),st=new Date(a.startDate||a.createdAt||Date.now()),nw=new Date();if(isNaN(mt.getTime())||isNaN(st.getTime())){g=a.balance;tx=a.alreadyNet?0:0;n=g}else{var td2=Math.max(1,(mt-st)/864e5),el=Math.min(Math.max(0,(nw-st)/864e5),td2);g=a.balance*(1+rt*(el/365));tx=a.alreadyNet?0:(g-a.balance)*(a.taxPercent/100);n=g-tx}}else if(a.type==="cash"){g=a.balance;n=g}if((a.type==="stock"||a.type==="option"||a.type==="savings"||a.type==="cash")&&a.currency&&a.currency!=="USD"&&S.xR[a.currency]){var cf=1/S.xR[a.currency];g*=cf;n*=cf;tx*=cf}return{g:g,n:n,tx:tx,cp:cp,src:src,pc:pc,ch:ch}}
function totals(){var G=0,N=0,T=0;activeP().forEach(function(a){var c=calc(a);G+=c.g;N+=c.n;T+=c.tx});return{g:G,n:N,t:T}}

// ---- Derived portfolio insights (all computed from existing S.P / S.txns / S.prices - nothing fabricated) ----
function txnsForAsset(id){return S.txns.filter(function(t){return t.assetId===id}).sort(function(a,b){var da=a.date||"",db=b.date||"";if(da!==db)return da<db?-1:1;return (a.createdAt||"")<(b.createdAt||"")?-1:1})}
// Weighted-average-cost basis reconstructed purely from that asset's own logged transactions.
// Returns null (not a fabricated number) when the asset has no transaction history to derive from.
function assetCostBasis(a){var txs=txnsForAsset(a.id);if(!txs.length)return null;var qty=0,cost=0,realized=0;for(var i=0;i<txs.length;i++){var t=txs[i];if(t.side==="buy"){cost+=(t.gross!==undefined?t.gross:t.qty*t.price);qty+=t.qty}else{var avgCost=qty>0?cost/qty:0;var soldCost=avgCost*t.qty;var proceeds=t.gross!==undefined?t.gross:t.qty*t.price;realized+=proceeds-soldCost;cost-=soldCost;qty-=t.qty;if(qty<1e-9){qty=0;cost=0}}}return{qty:qty,costBasis:cost,avgCost:qty>0?cost/qty:0,realized:realized,currency:a.currency||"USD",txCount:txs.length}}
// Only compares current value against cost basis for the quantity actually reconstructed from logged
// transactions - if some of the position's quantity predates transaction tracking (or was hand-edited),
// that untracked portion is excluded from the gain math rather than silently assumed to have $0 cost.
function assetUnrealized(a){var cb=assetCostBasis(a);if(!cb||cb.qty<=0)return null;var c=calc(a);var perUnitGross=a.quantity?c.g/a.quantity:0;var trackedGross=perUnitGross*cb.qty;var gainG=trackedGross-cb.costBasis;return{gainG:gainG,pct:cb.costBasis?(gainG/cb.costBasis*100):null,costBasis:cb.costBasis,avgCost:cb.avgCost,realized:cb.realized,trackedQty:cb.qty,totalQty:a.quantity,partial:Math.abs(cb.qty-(a.quantity||0))>1e-6}}
function portfolioPL(){var unrG=0,realG=0,covered=0,total=0;S.P.forEach(function(a){if(a.type==="cash")return;total++;var u=assetUnrealized(a);if(u){covered++;unrG+=convCur(u.gainG,a.currency||"USD","USD");realG+=convCur(u.realized,a.currency||"USD","USD")}});return{unrealized:unrG,realized:realG,covered:covered,total:total,partial:covered>0&&covered<total}}
// Today's $ / % change per asset from cached live quotes only (no fetch) - used for Overview "today" stat and best/worst mover.
function assetTodayChangeUSD(a){var pd=a.symbol?S.prices[a.symbol.toUpperCase()]:null;if(!pd||!pd.price)return null;var curP=pd.price,prevP=null;if(a.type==="crypto"){if(pd.ch24!=null&&pd.ch24>-100)prevP=pd.price/(1+pd.ch24/100)}else if(pd.pc)prevP=pd.pc;if(prevP==null)return null;var c=calc(a);if(!c.cp)return null;var deltaPerUnit=curP-prevP,qtyEff=a.type==="option"?a.quantity:a.quantity;var chgG=deltaPerUnit*qtyEff;var tax=a.alreadyNet?0:(a.taxPercent||0)/100;var chgN=chgG*(1-tax);return{chgUSD:convCur(chgN,a.currency||"USD","USD"),pct:prevP?((curP-prevP)/prevP*100):null}}
function todaysChange(){var tot=0,have=false,movers=[];S.P.forEach(function(a){if(a.type!=="stock"&&a.type!=="option"&&a.type!=="crypto")return;var ch=assetTodayChangeUSD(a);if(!ch)return;have=true;tot+=ch.chgUSD;movers.push({a:a,chgUSD:ch.chgUSD,pct:ch.pct})});var n0=totals().n,base=n0-tot;return{have:have,chgUSD:tot,pct:base?((tot/Math.abs(base))*100):null,movers:movers}}
function currencyExposure(){var m={};activeP().forEach(function(a){if(a.type==="option")return;var cur=a.currency||"USD",c=calc(a);m[cur]=(m[cur]||0)+c.g});return m}
function typeAllocation(){var m={etf:0,stocks:0,deposits:0,crypto:0,cash:0};activeP().forEach(function(a){m[getBucket(a)]+=calc(a).g});return m}
function topHoldings(n){return activeP().slice().sort(function(x,y){return calc(y).g-calc(x).g}).slice(0,n||3)}
function concentration(){var t=totals().g||1,top=topHoldings(3);return{top1Pct:top.length?(calc(top[0]).g/t*100):0,top3Pct:top.reduce(function(s,a){return s+calc(a).g},0)/t*100,top:top}}
// Cumulative net-invested-capital series reconstructed from logged transaction cash flows (buys add, sells subtract), in USD.
function contributionsSeries(){var txs=S.txns.slice().sort(function(a,b){var da=a.date||"",db=b.date||"";if(da!==db)return da<db?-1:1;return (a.createdAt||"")<(b.createdAt||"")?-1:1});if(!txs.length)return null;var cum=0,pts=[];txs.forEach(function(t){var usd=convCur(t.netAmt||0,t.currency||"USD","USD");cum+=t.side==="buy"?usd:-usd;pts.push({time:new Date(t.date).getTime(),price:cum})});return pts}

function chartSvgHtml(pts,elId,pctFromFirst){var W=600,H=150;var vals=pts.map(function(p){return p.price});var vmin=Math.min.apply(null,vals),vmax=Math.max.apply(null,vals);if(vmin===vmax){vmin-=Math.abs(vmin*.01)||1;vmax+=Math.abs(vmax*.01)||1}var tmin=pts[0].time,tmax=pts[pts.length-1].time||tmin+1;function X(t){return tmax>tmin?((t-tmin)/(tmax-tmin))*W:0}function Y(v){return 4+(H-8)-((v-vmin)/(vmax-vmin))*(H-8)}var d="M"+pts.map(function(p){return X(p.time).toFixed(1)+","+Y(p.price).toFixed(1)}).join(" L ");var first=pts[0],last=pts[pts.length-1];var up=last.price>=first.price;var lineColor=up?"var(--grn)":"var(--red)";var areaD=d+" L"+X(last.time).toFixed(1)+","+H+" L"+X(first.time).toFixed(1)+","+H+" Z";var gid="cg"+elId;return{svg:'<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" id="'+elId+'-svg"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+lineColor+'" stop-opacity="0.22"/><stop offset="100%" stop-color="'+lineColor+'" stop-opacity="0"/></linearGradient></defs><path d="'+areaD+'" fill="url(#'+gid+')" stroke="none"/><path d="'+d+'" fill="none" stroke="'+lineColor+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle id="'+elId+'-dot" cx="'+X(last.time)+'" cy="'+Y(last.price)+'" r="3.2" fill="'+lineColor+'" style="display:none"/><line id="'+elId+'-vline" x1="0" y1="0" x2="0" y2="'+H+'" stroke="var(--brd)" stroke-width="1" style="display:none"/></svg>',W:W,H:H,X:X,Y:Y,tmin:tmin,tmax:tmax,color:lineColor}}
function wireChart(pts,elId,tipId){var g=chartSvgHtml(pts,elId);var el=$(elId);if(!el)return;el.innerHTML=g.svg;var svgEl=$(elId+"-svg"),dot=$(elId+"-dot"),vline=$(elId+"-vline"),tip=$(tipId);function pick(clientX){var rect=svgEl.getBoundingClientRect();var relX=rect.width?(clientX-rect.left)/rect.width:0;relX=Math.max(0,Math.min(1,relX));var t=g.tmin+relX*(g.tmax-g.tmin);var best=pts[0],bd=Infinity;for(var i=0;i<pts.length;i++){var dd=Math.abs(pts[i].time-t);if(dd<bd){bd=dd;best=pts[i]}}return best}function showAt(p){dot.style.display="block";dot.setAttribute("cx",g.X(p.time));dot.setAttribute("cy",g.Y(p.price));vline.style.display="block";vline.setAttribute("x1",g.X(p.time));vline.setAttribute("x2",g.X(p.time));if(tip){var rect=svgEl.getBoundingClientRect();var px=rect.width*(g.X(p.time)/g.W);tip.style.left=Math.max(30,Math.min(rect.width-30,px))+"px";tip.innerHTML='<div class="tv">'+fmt(p.price)+'</div><div class="td">'+new Date(p.time).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+"</div>";tip.classList.add("show")}}function hide(){dot.style.display="none";vline.style.display="none";if(tip)tip.classList.remove("show")}function onMove(cx){showAt(pick(cx))}svgEl.addEventListener("mousemove",function(e){onMove(e.clientX)});svgEl.addEventListener("mouseleave",hide);svgEl.addEventListener("touchstart",function(e){onMove(e.touches[0].clientX)},{passive:true});svgEl.addEventListener("touchmove",function(e){onMove(e.touches[0].clientX);e.preventDefault()},{passive:false});svgEl.addEventListener("touchend",hide)}

function startMoneyRain(){
  var ov=document.createElement("div");ov.className="rainOv";
  var cvs=document.createElement("canvas");var W=240,H=320;cvs.width=W;cvs.height=H;cvs.style.width=(W*2)+"px";cvs.style.height=(H*2)+"px";
  ov.appendChild(cvs);document.body.appendChild(ov);ov.onclick=function(){document.body.removeChild(ov)};
  var ctx=cvs.getContext("2d");
  function drawG(){ctx.fillStyle="#1a1714";ctx.fillRect(0,0,W,H);ctx.fillStyle="#5a5248";for(var bx=30;bx<W-20;bx+=28)ctx.fillRect(bx,40,3,240);ctx.fillRect(20,40,W-40,3);ctx.fillRect(20,277,W-40,3);var gx=100,gy=160;ctx.fillStyle="#4a4040";ctx.fillRect(gx,gy,40,50);ctx.fillRect(gx+8,gy-20,24,24);ctx.fillRect(gx-12,gy+8,16,30);ctx.fillRect(gx+36,gy+8,16,30);ctx.fillRect(gx+4,gy+46,14,18);ctx.fillRect(gx+22,gy+46,14,18);ctx.fillStyle="#6a5a4a";ctx.fillRect(gx+12,gy-14,16,12);ctx.fillStyle="#e8e0d4";ctx.fillRect(gx+14,gy-12,4,4);ctx.fillRect(gx+22,gy-12,4,4);ctx.fillStyle="#1a1714";ctx.fillRect(gx+15,gy-11,2,2);ctx.fillRect(gx+23,gy-11,2,2);ctx.fillStyle="#3a2a2a";ctx.fillRect(gx+16,gy-4,8,3);ctx.fillStyle="#5a4a3a";ctx.fillRect(gx+12,gy+10,16,14)}
  var bills=[];var syms=["$","E","L","S"];var cols=["#8db87a","#d4b88c","#7ab8b8","#a07ab8"];
  for(var mi=0;mi<40;mi++)bills.push({x:Math.random()*W,y:-Math.random()*H*2,s:syms[mi%4],sp:0.4+Math.random()*1.2,wx:Math.random()*2-1,sz:8+Math.floor(Math.random()*6),c:cols[mi%4]});
  var frame=0;
  function tick(){if(frame>300||!document.body.contains(ov))return;drawG();for(var bi=0;bi<bills.length;bi++){var b=bills[bi];b.y+=b.sp;b.x+=Math.sin(frame*0.05+bi)*b.wx*0.5;if(b.y>H+20){b.y=-20;b.x=Math.random()*W}ctx.fillStyle=b.c;ctx.font="bold "+b.sz+"px monospace";ctx.fillText(b.s,b.x,b.y)}if(frame%60>50){ctx.fillStyle="#4a4040";ctx.fillRect(114,148,4,4);ctx.fillRect(122,148,4,4)}frame++;requestAnimationFrame(tick)}tick()
}

function showMood(){
  var cd=S.lastPortfolioChart;
  if(!cd||cd.length<2){toast("Need price data first");return}
  var isUp=cd[cd.length-1].price>=cd[0].price;
  var scene=Math.random()<0.5?0:1;
  var ov=document.createElement("div");ov.className="rainOv";
  var cvs=document.createElement("canvas");var W=280,H=320;cvs.width=W;cvs.height=H;cvs.style.width=(W*2)+"px";cvs.style.height=(H*2)+"px";
  ov.appendChild(cvs);document.body.appendChild(ov);ov.onclick=function(){document.body.removeChild(ov)};
  var ctx=cvs.getContext("2d");
  var frame=0;

  function drawGorilla(gx,gy){
    ctx.fillStyle="#4a4040";ctx.fillRect(gx,gy,40,50);ctx.fillRect(gx+8,gy-20,24,24);ctx.fillRect(gx-12,gy+8,16,30);ctx.fillRect(gx+36,gy+8,16,30);ctx.fillRect(gx+4,gy+46,14,18);ctx.fillRect(gx+22,gy+46,14,18);
    ctx.fillStyle="#6a5a4a";ctx.fillRect(gx+12,gy-14,16,12);
    ctx.fillStyle="#e8e0d4";ctx.fillRect(gx+14,gy-12,4,4);ctx.fillRect(gx+22,gy-12,4,4);
    ctx.fillStyle="#1a1714";ctx.fillRect(gx+15,gy-11,2,2);ctx.fillRect(gx+23,gy-11,2,2);
    ctx.fillStyle="#3a2a2a";ctx.fillRect(gx+16,gy-4,8,3);
    ctx.fillStyle="#5a4a3a";ctx.fillRect(gx+12,gy+10,16,14);
  }

  function tickUp0(){
    // Sunglasses + gold chain
    if(frame>300||!document.body.contains(ov))return;
    ctx.fillStyle="#1a1714";ctx.fillRect(0,0,W,H);
    // Stars bg
    ctx.fillStyle="#d4b88c";for(var si=0;si<20;si++){var sx=(si*37+frame*0.3)%W,ssy=(si*53+frame*0.2)%H;ctx.fillRect(sx,ssy,2,2)}
    var gx=120,gy=140;drawGorilla(gx,gy);
    // Gold chain - animate drop in
    var chainY=Math.min(gy+20,gy-40+frame*1.5);
    if(chainY>=gy+6){
      ctx.fillStyle="#d4b88c";
      for(var ci=-12;ci<=12;ci+=4){ctx.fillRect(gx+8+ci,chainY,3,3)}
      ctx.fillRect(gx+8,chainY+3,3,8);ctx.fillRect(gx+5,chainY+8,9,5);// pendant
      ctx.fillStyle="#ffd700";ctx.fillRect(gx+7,chainY+9,5,3);// $ on pendant
    }
    // Sunglasses - slide in from left
    var glassX=Math.min(gx+10,frame*3-40);
    if(glassX>=gx+10){
      ctx.fillStyle="#1a1714";ctx.fillRect(gx+11,gy-14,6,5);ctx.fillRect(gx+19,gy-14,6,5);
      ctx.fillStyle="#2a2a3a";ctx.fillRect(gx+12,gy-13,4,3);ctx.fillRect(gx+20,gy-13,4,3);
      ctx.fillStyle="#1a1714";ctx.fillRect(gx+17,gy-13,2,1);// bridge
    }
    // Smile
    if(frame>60){ctx.fillStyle="#6a5a4a";ctx.fillRect(gx+14,gy-3,12,2);ctx.fillRect(gx+16,gy-1,8,2)}
    // Text
    if(frame>80){ctx.fillStyle="#d4b88c";ctx.font="bold 14px monospace";ctx.textAlign="center";ctx.fillText("LOOKING GOOD",W/2,gy+90)}
    frame++;requestAnimationFrame(tickUp0);
  }

  function tickUp1(){
    // SIUUU celebration
    if(frame>300||!document.body.contains(ov))return;
    ctx.fillStyle="#1a1714";ctx.fillRect(0,0,W,H);
    var gx=120,baseY=160;
    // Jump arc
    var jumpPhase=Math.min(frame/40,1);
    var jumpH=Math.sin(jumpPhase*Math.PI)*60;
    var gy=baseY-jumpH;
    // Body
    ctx.fillStyle="#4a4040";ctx.fillRect(gx,gy,40,50);ctx.fillRect(gx+8,gy-20,24,24);
    // Legs spread
    ctx.fillRect(gx-4,gy+46,14,18);ctx.fillRect(gx+30,gy+46,14,18);
    // Arms UP in V shape
    var armAngle=Math.min(frame/30,1);
    ctx.fillRect(gx-16+armAngle*4,gy-10-armAngle*30,14,6);
    ctx.fillRect(gx+40-armAngle*4,gy-10-armAngle*30,14,6);
    // Face
    ctx.fillStyle="#6a5a4a";ctx.fillRect(gx+12,gy-14,16,12);
    ctx.fillStyle="#e8e0d4";ctx.fillRect(gx+14,gy-12,4,4);ctx.fillRect(gx+22,gy-12,4,4);
    ctx.fillStyle="#1a1714";ctx.fillRect(gx+15,gy-11,2,2);ctx.fillRect(gx+23,gy-11,2,2);
    // Open mouth (shouting)
    ctx.fillStyle="#3a2020";ctx.fillRect(gx+14,gy-5,12,6);
    ctx.fillStyle="#5a4a3a";ctx.fillRect(gx+12,gy+10,16,14);
    // SIUUU text with growing size
    if(frame>30){
      var sz=Math.min(24,10+frame*0.1);
      ctx.fillStyle="#8db87a";ctx.font="bold "+Math.floor(sz)+"px monospace";ctx.textAlign="center";
      ctx.fillText("SIUUUUU!",W/2,baseY+100);
    }
    // Confetti
    if(frame>40){ctx.fillStyle=["#d4b88c","#8db87a","#7ab8b8","#a07ab8"][frame%4];for(var ci=0;ci<8;ci++){var cx2=(ci*41+frame*2)%W,cy=(ci*67+frame*1.5)%H;ctx.fillRect(cx2,cy,4,4)}}
    frame++;requestAnimationFrame(tickUp1);
  }

  function tickDn0(){
    // Rainy window - gorilla looking out
    if(frame>300||!document.body.contains(ov))return;
    ctx.fillStyle="#1a1a2a";ctx.fillRect(0,0,W,H);
    // Window frame
    ctx.fillStyle="#3a3430";ctx.fillRect(40,30,200,200);
    ctx.fillStyle="#2a2a3a";ctx.fillRect(45,35,190,190);
    // Window cross
    ctx.fillStyle="#3a3430";ctx.fillRect(138,35,4,190);ctx.fillRect(45,127,190,4);
    // Rain outside window
    ctx.fillStyle="#4a5a6a";
    for(var ri=0;ri<30;ri++){var rx=45+(ri*17)%190;var ry=(ri*31+frame*3)%190+35;ctx.fillRect(rx,ry,1,6)}
    // Gorilla sitting, looking at window from inside
    var gx=100,gy=240;
    ctx.fillStyle="#4a4040";ctx.fillRect(gx,gy,40,40);ctx.fillRect(gx+8,gy-18,24,22);
    // One arm on window
    ctx.fillRect(gx+30,gy-20,20,8);ctx.fillRect(gx+46,gy-40,8,28);
    // Sad face
    ctx.fillStyle="#6a5a4a";ctx.fillRect(gx+12,gy-12,16,10);
    ctx.fillStyle="#e8e0d4";ctx.fillRect(gx+14,gy-10,4,3);ctx.fillRect(gx+22,gy-10,4,3);
    ctx.fillStyle="#1a1714";ctx.fillRect(gx+15,gy-9,2,2);ctx.fillRect(gx+23,gy-9,2,2);
    // Frown
    ctx.fillStyle="#3a2a2a";ctx.fillRect(gx+16,gy-2,8,1);ctx.fillRect(gx+14,gy-3,4,1);ctx.fillRect(gx+22,gy-3,4,1);
    // Tear
    if(frame%40<20){ctx.fillStyle="#6a8aaa";ctx.fillRect(gx+26,gy-6,2,4)}
    // Text
    ctx.fillStyle="#6a6a7a";ctx.font="12px monospace";ctx.textAlign="center";
    ctx.fillText("could be worse...",W/2,H-20);
    frame++;requestAnimationFrame(tickDn0);
  }

  function tickDn1(){
    // Breaking Wall Street sign
    if(frame>300||!document.body.contains(ov))return;
    ctx.fillStyle="#1a1714";ctx.fillRect(0,0,W,H);
    // Street/ground
    ctx.fillStyle="#2a2520";ctx.fillRect(0,260,W,60);
    // Sign post
    var signTilt=frame>60?Math.min((frame-60)*0.3,25):0;
    ctx.save();ctx.translate(180,120);ctx.rotate(signTilt*Math.PI/180);
    ctx.fillStyle="#4a6a4a";ctx.fillRect(-4,-120,8,180);// post
    ctx.fillStyle="#2a5a2a";ctx.fillRect(-50,-130,100,28);// sign bg
    ctx.fillStyle="#e8e0d4";ctx.font="bold 9px monospace";ctx.textAlign="center";ctx.fillText("WALL ST",0,-112);
    ctx.restore();
    // Gorilla swinging at sign
    var gx=70,gy=170;
    ctx.fillStyle="#4a4040";ctx.fillRect(gx,gy,40,50);ctx.fillRect(gx+8,gy-20,24,24);
    ctx.fillRect(gx+4,gy+46,14,18);ctx.fillRect(gx+22,gy+46,14,18);
    // Arms swinging
    var swingPhase=Math.min(frame/30,1);
    var armX=gx+30+swingPhase*40;var armY=gy-10-swingPhase*20;
    ctx.fillRect(armX,armY,16,8);
    // Left arm down
    ctx.fillRect(gx-14,gy+10,16,8);
    // Angry face
    ctx.fillStyle="#6a5a4a";ctx.fillRect(gx+12,gy-14,16,12);
    ctx.fillStyle="#e8e0d4";ctx.fillRect(gx+14,gy-12,4,4);ctx.fillRect(gx+22,gy-12,4,4);
    ctx.fillStyle="#c44040";ctx.fillRect(gx+15,gy-11,2,2);ctx.fillRect(gx+23,gy-11,2,2);// red eyes
    // Angry mouth
    ctx.fillStyle="#3a2020";ctx.fillRect(gx+14,gy-5,12,5);
    // Eyebrows angled
    ctx.fillStyle="#3a3030";ctx.fillRect(gx+12,gy-16,6,2);ctx.fillRect(gx+22,gy-16,6,2);
    // Debris if hit
    if(frame>60){ctx.fillStyle="#4a6a4a";for(var di=0;di<6;di++){var dx=160+(di*23+frame*1.5)%80-40;var dy=100+(frame-60)*1.5+di*15;if(dy<H)ctx.fillRect(dx,dy,5,3)}}
    // Text
    if(frame>80){ctx.fillStyle="#c48080";ctx.font="bold 12px monospace";ctx.textAlign="center";ctx.fillText("NOT TODAY",W/2,H-20)}
    frame++;requestAnimationFrame(tickDn1);
  }

  if(isUp){if(scene===0)tickUp0();else tickUp1()}
  else{if(scene===0)tickDn0();else tickDn1()}
}

function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function drawSpaced(ctx,text,x,y,sp,align){align=align||"left";var chars=text.split(""),widths=chars.map(function(c){return ctx.measureText(c).width}),total=widths.reduce(function(a,b){return a+b},0)+sp*(chars.length-1);var sx=align==="center"?x-total/2:align==="right"?x-total:x;var pa=ctx.textAlign;ctx.textAlign="left";for(var i=0;i<chars.length;i++){ctx.fillText(chars[i],sx,y);sx+=widths[i]+sp}ctx.textAlign=pa}
function drawStat(ctx,cx,y,label,val,valColor,labelColor){var pa=ctx.textAlign;ctx.textAlign="center";ctx.font="300 10px Inter, sans-serif";ctx.fillStyle=labelColor;drawSpaced(ctx,label,cx,y,2,"center");ctx.font="400 18px 'Cormorant Garamond', Georgia, serif";ctx.fillStyle=valColor;ctx.fillText(val,cx,y+23);ctx.textAlign=pa}

function sectionHead(ctx,text,x,y,color){ctx.textAlign="left";ctx.font="400 12px 'Cormorant Garamond', Georgia, serif";ctx.fillStyle=color;drawSpaced(ctx,text,x,y,2,"left")}
function reportLayout(ctx,W,pad){
  // Shared draw routine, called twice: once with ctx=null to measure total
  // height, once with a real ctx to draw. Keeps the two in lockstep - no
  // hand-maintained height formula to drift out of sync with the drawing.
  var t=totals();
  var bk={etf:0,stocks:0,deposits:0,crypto:0,cash:0},bL={etf:"ETFs",stocks:"Stocks",deposits:"Deposits",crypto:"Crypto",cash:"Cash"};
  activeP().forEach(function(a){bk[getBucket(a)]+=calc(a).g});
  var totalG=t.g||1;
  var bks=["etf","stocks","deposits","crypto","cash"].filter(function(b){return bk[b]>0});
  var locSums={},locOrder=[];
  activeP().forEach(function(a){var loc=a.location||"Unassigned";if(locSums[loc]===undefined){locSums[loc]=0;locOrder.push(loc)}locSums[loc]+=calc(a).g});
  locOrder.sort(function(x,y){return locSums[y]-locSums[x]});
  var holdings=activeP().slice().sort(function(x,y){return calc(y).g-calc(x).g});
  var draw=!!ctx;
  var cardHC,brdC,brdC2,txtC,tx2C,tx3C,accC,redC;
  if(draw){cardHC=cssVar("--cardH")||"#ede8e1";brdC=cssVar("--brdL")||"#e0dbd4";brdC2=cssVar("--brd")||"#d4cec5";txtC=cssVar("--txt")||"#2a2520";tx2C=cssVar("--tx2")||"#5a5248";tx3C=cssVar("--tx3")||"#7a7268";accC=cssVar("--acc")||"#8a7050";redC=cssVar("--red")||"#a05050"}
  var topBar=4,lineH=19,y=pad+topBar;
  function hr(gap1,gap2){if(draw){ctx.strokeStyle=brdC2;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,y+gap1);ctx.lineTo(W-pad,y+gap1);ctx.stroke()}y+=gap1+gap2}
  if(draw){ctx.fillStyle=accC;ctx.fillRect(0,0,W,topBar);ctx.textAlign="center"}
  if(draw){ctx.font="300 13px Inter, sans-serif";ctx.fillStyle=tx2C;drawSpaced(ctx,"VAULT",W/2,y,6,"center")}
  y+=19;
  var now=new Date();
  var tsTxt=now.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})+" "+String.fromCharCode(183)+" "+now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  if(draw){ctx.font="300 10px Inter, sans-serif";ctx.fillStyle=tx3C;ctx.fillText(tsTxt,W/2,y)}
  y+=38;
  if(draw){ctx.font="300 36px 'Cormorant Garamond', Georgia, serif";ctx.fillStyle=txtC;ctx.fillText(fmt(t.n),W/2,y)}
  y+=17;
  if(draw){ctx.font="300 9px Inter, sans-serif";ctx.fillStyle=tx3C;drawSpaced(ctx,"TOTAL NET VALUE",W/2,y,2,"center")}
  y+=30;
  var gx=W/2-160;
  if(draw){drawStat(ctx,gx,y,"GROSS",fmt(t.g,true),tx2C,tx3C);drawStat(ctx,W/2,y,"TAX",(t.t>0?"-":"")+fmt(t.t,true),redC,tx3C);drawStat(ctx,gx+320,y,"NET",fmt(t.n,true),accC,tx3C)}
  y+=40;
  hr(0,24);
  if(bks.length){
    if(draw)sectionHead(ctx,"ALLOCATION",pad,y,tx2C);
    y+=14;
    var barY=y,barH=7,barX=pad,barW=W-2*pad;
    if(draw){var bx=barX;ctx.save();ctx.beginPath();ctx.rect(barX,barY,barW,barH);ctx.clip();bks.forEach(function(b){var w=(bk[b]/totalG)*barW;ctx.fillStyle=BCOL[b];ctx.fillRect(bx,barY,w+1,barH);bx+=w});ctx.restore()}
    y=barY+barH+20;
    var perRow=2,rowW=barW/perRow;
    bks.forEach(function(b,bi){var col=bi%perRow,row=Math.floor(bi/perRow),bx2=pad+col*rowW,by=y+row*lineH;if(draw){ctx.fillStyle=BCOL[b];ctx.beginPath();ctx.arc(bx2+3,by-4,3,0,Math.PI*2);ctx.fill();ctx.fillStyle=tx2C;ctx.textAlign="left";ctx.font="300 11px Inter, sans-serif";ctx.fillText(bL[b]+" "+fmt(bk[b],true)+" ("+Math.round(bk[b]/totalG*100)+"%)",bx2+11,by)}});
    y+=Math.ceil(bks.length/perRow)*lineH+14;
  }
  if(locOrder.length){
    hr(0,20);
    if(draw)sectionHead(ctx,"BY SOURCE",pad,y,tx2C);
    y+=22;
    if(draw)ctx.font="300 12px Inter, sans-serif";
    locOrder.forEach(function(loc){var v=locSums[loc],pc=totalG?(v/totalG*100):0;if(draw){ctx.fillStyle=txtC;ctx.textAlign="left";ctx.fillText(loc,pad,y);ctx.fillStyle=tx2C;ctx.textAlign="right";ctx.fillText(fmt(v,true)+"  ("+pc.toFixed(1)+"%)",W-pad,y)}y+=lineH-2});
    y+=8;
  }
  if(holdings.length){
    hr(0,22);
    if(draw)sectionHead(ctx,"HOLDINGS",pad,y,tx2C);
    y+=20;
    var tagTxt={stock:"Stock",option:"Option",crypto:"Crypto",savings:"Deposit",cash:"Cash"};
    var cols=holdings.length>4?2:1,colW=(W-2*pad-(cols>1?20:0))/cols,rowH=29;
    holdings.forEach(function(a,idx){
      var col=idx%cols,row=Math.floor(idx/cols),hx=pad+col*(colW+20),hy=y+row*rowH;
      if(!draw)return;
      var c=calc(a),nm=(a.type==="savings"||a.type==="cash")?a.name:a.symbol,tag=a.type==="stock"&&isAETF(a)?"ETF":tagTxt[a.type],bkt=getBucket(a);
      ctx.fillStyle=BCOL[bkt];ctx.beginPath();ctx.arc(hx,hy-3.5,2.6,0,Math.PI*2);ctx.fill();
      ctx.font="400 12px Inter, sans-serif";ctx.fillStyle=txtC;ctx.textAlign="left";ctx.fillText(nm,hx+9,hy);
      ctx.font="300 12px Inter, sans-serif";ctx.fillStyle=tx2C;ctx.textAlign="right";ctx.fillText(fmt(c.g,true),hx+colW,hy);
      var meta=[];
      if(a.type==="option")meta.push(a.quantity+" opts");
      else if(a.type==="savings")meta.push(a.interestRate+"%");
      else if(a.type==="cash")meta.push(a.currency||"USD");
      else meta.push(a.quantity+" "+(a.type==="crypto"?"units":"sh"));
      meta.push(tag);
      ctx.font="300 9px Inter, sans-serif";ctx.fillStyle=tx3C;ctx.textAlign="left";
      ctx.fillText(meta.join(" "+String.fromCharCode(183)+" "),hx+9,hy+12);
    });
    y+=Math.ceil(holdings.length/cols)*rowH+6;
  }
  hr(0,20);
  if(draw){ctx.textAlign="center";ctx.font="300 9px Inter, sans-serif";ctx.fillStyle=tx3C;ctx.fillText(String.fromCharCode(0x1F98D)+"  Vault"+String.fromCharCode(160)+String.fromCharCode(183)+String.fromCharCode(160)+tsTxt,W/2,y)}
  y+=pad-12;
  return y;
}
function buildReportCanvas(){
  var bgC=cssVar("--bg")||"#f4f0eb";
  var scale=3,W=560,pad=26;
  var H=reportLayout(null,W,pad);
  var cvs=document.createElement("canvas");cvs.width=W*scale;cvs.height=H*scale;
  var ctx=cvs.getContext("2d");ctx.scale(scale,scale);
  ctx.fillStyle=bgC;ctx.fillRect(0,0,W,H);
  reportLayout(ctx,W,pad);
  ctx.strokeStyle=cssVar("--brdL")||"#e0dbd4";ctx.lineWidth=1;ctx.strokeRect(.5,.5,W-1,H-1);
  return cvs;
}

  toast("Building report...");

      var now2=new Date(),hh=String(now2.getHours()).padStart(2,"0"),mm=String(now2.getMinutes()).padStart(2,"0");

    },"image/png")
  },30)
}

else if(type==="option"){h='<div class="fi"><label>Ticker</label><input id="fSym" value="'+esc(a.symbol||"")+'"></div><div class="fi"><label>Name</label><input id="fNm" value="'+esc(a.displayName||"")+'"></div><div class="fr"><div class="fi"><label>Options</label><input id="fQty" type="number" step="any" value="'+(a.quantity||"")+'"></div><div class="fi"><label>Exercise $</label><input id="fEx" type="number" step="any" value="'+(a.exercisePrice||"")+'"></div></div><div class="fr"><div class="fi"><label>Tax %</label><input id="fTax" type="number" step="any" value="'+(a.taxPercent!==undefined?a.taxPercent:25)+'"></div><div class="fi"><label>Currency</label>'+curSel(a.currency)+'</div></div><div class="fi"><label>Location</label>'+locSel(a.location)+'</div><div class="cb"><input type="checkbox" id="fNet"'+(a.alreadyNet?" checked":"")+'><label for="fNet">Already net (tax=0)</label></div>'}
else if(type==="crypto"){h='<div class="fi"><label>Coin</label><input id="fSym" value="'+esc(a.symbol||"")+'"></div><div class="fr"><div class="fi"><label>Qty</label><input id="fQty" type="number" step="any" value="'+(a.quantity||"")+'"></div><div class="fi"><label>Manual Price</label><input id="fMp" type="number" step="any" value="'+(a.manualPrice||"")+'"></div></div><div class="fi"><label>Tax %</label><input id="fTax" type="number" step="any" value="'+(a.taxPercent!==undefined?a.taxPercent:25)+'"></div><div class="fi"><label>Location</label>'+locSel(a.location)+'</div><div class="cb"><input type="checkbox" id="fNet"'+(a.alreadyNet?" checked":"")+'><label for="fNet">Already net (tax=0)</label></div>'}
else if(type==="savings"){h='<div class="fi"><label>Account</label><input id="fNm" value="'+esc(a.name||"")+'"></div><div class="fr"><div class="fi"><label>Deposit</label><input id="fBal" type="number" step="any" value="'+(a.balance||"")+'"></div><div class="fi"><label>Interest %</label><input id="fInt" type="number" step="any" value="'+(a.interestRate||"")+'"></div></div><div class="fr"><div class="fi"><label>Start</label><input id="fSt" type="date" value="'+(a.startDate||new Date().toISOString().split("T")[0])+'"></div><div class="fi"><label>Maturity</label><input id="fMt" type="date" value="'+(a.maturityDate||"")+'"></div></div><div class="fr"><div class="fi"><label>Tax %</label><input id="fTax" type="number" step="any" value="'+(a.taxPercent!==undefined?a.taxPercent:25)+'"></div><div class="fi"><label>Currency</label>'+curSel(a.currency)+'</div></div><div class="fi"><label>Location</label>'+locSel(a.location)+'</div><div class="cb"><input type="checkbox" id="fNet"'+(a.alreadyNet?" checked":"")+'><label for="fNet">Already net (tax=0)</label></div>'}
else if(type==="cash"){h='<div class="fi"><label>Label</label><input id="fNm" value="'+esc(a.name||"")+'"></div><div class="fr"><div class="fi"><label>Amount</label><input id="fBal" type="number" step="any" value="'+(a.balance||"")+'"></div><div class="fi"><label>Currency</label>'+curSel(a.currency)+'</div></div><div class="fi"><label>Location</label>'+locSel(a.location)+"</div>"}
f.innerHTML=h;$("moBg").classList.add("act");setTimeout(function(){var inp=f.querySelector("input");if(inp)inp.focus();var cb=$("fNet"),tax=$("fTax");if(cb&&tax)cb.onchange=function(){if(cb.checked)tax.value="0"};var symIn=$("fSym"),nmIn=$("fNm");if(symIn&&nmIn&&(type==="stock"||type==="option")){symIn.onblur=async function(){var v=symIn.value.trim().toUpperCase();if(!v)return;var etf=$("fETF");if(etf)etf.checked=autoETF(v);if(!nmIn.value||nmIn.dataset.a==="1"){nmIn.value="Fetching...";nmIn.dataset.a="1";var nm=await fetchName(v);nmIn.value=nm||""}};nmIn.oninput=function(){nmIn.dataset.a="0"}}},100)}
function closeModal(){$("moBg").classList.remove("act");S.editId=null;S.mIsTxn=false}
function saveAsset(){var t=S.mTp,a;if(S.editId){a=S.P.find(function(x){return x.id===S.editId})}else{a={id:"a"+Date.now(),type:t,createdAt:new Date().toISOString()}}var loc=$("fLoc");a.location=loc?loc.value:"";if(t==="stock"){a.symbol=($("fSym").value||"").toUpperCase().trim();a.quantity=parseFloat($("fQty").value)||0;var mp=$("fMp");a.manualPrice=mp?(parseFloat(mp.value)||null):null;a.taxPercent=parseFloat($("fTax").value)||0;a.alreadyNet=$("fNet").checked;if(a.alreadyNet)a.taxPercent=0;a.currency=$("fCur").value;a.displayName=($("fNm").value||"").trim();var etf=$("fETF");a.isETF=etf?etf.checked:false;if(!a.symbol||!a.quantity){toast("Need symbol & qty");return}}else if(t==="option"){a.symbol=($("fSym").value||"").toUpperCase().trim();a.quantity=parseFloat($("fQty").value)||0;a.exercisePrice=parseFloat($("fEx").value)||0;a.taxPercent=parseFloat($("fTax").value)||0;a.alreadyNet=$("fNet").checked;if(a.alreadyNet)a.taxPercent=0;a.currency=$("fCur").value;a.displayName=($("fNm").value||"").trim();if(!a.symbol||!a.quantity){toast("Need symbol & qty");return}}else if(t==="crypto"){a.symbol=($("fSym").value||"").toUpperCase().trim();a.quantity=parseFloat($("fQty").value)||0;var mp2=$("fMp");a.manualPrice=mp2?(parseFloat(mp2.value)||null):null;a.taxPercent=parseFloat($("fTax").value)||0;a.alreadyNet=$("fNet").checked;if(a.alreadyNet)a.taxPercent=0;a.currency="USD";if(!a.symbol||!a.quantity){toast("Need symbol & qty");return}}else if(t==="savings"){a.name=($("fNm").value||"").trim();a.balance=parseFloat($("fBal").value)||0;a.interestRate=parseFloat($("fInt").value)||0;a.startDate=$("fSt").value;a.maturityDate=$("fMt").value;a.taxPercent=parseFloat($("fTax").value)||0;a.alreadyNet=$("fNet").checked;if(a.alreadyNet)a.taxPercent=0;a.currency=$("fCur").value;if(!a.name||!a.balance){toast("Need name & balance");return}}else if(t==="cash"){a.name=($("fNm").value||"").trim();a.balance=parseFloat($("fBal").value)||0;a.currency=$("fCur").value;if(!a.name||!a.balance){toast("Need name & amount");return}}if(!S.editId)S.P.push(a);closeModal();toast(S.editId?"Updated":"Added");save();refreshAll()}
function editAsset(id){var a=S.P.find(function(x){return x.id===id});if(a)openModal(a.type,a)}
function deleteAsset(id){if(!confirm("Remove?")){return}S.P=S.P.filter(function(x){return x.id!==id});if(S.selA===id)S.selA=null;save();renderAll();loadPortfolioChange();toast("Removed")}
window.openModal=openModal;window.closeModal=closeModal;window.saveAsset=saveAsset;window.editAsset=editAsset;window.deleteAsset=deleteAsset;window.switchTab=switchTab;
function doExport(){var d=getPayload();d.exportedAt=new Date().toISOString();var b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});var u=URL.createObjectURL(b);triggerDl(u,"vault-"+dateStr(new Date())+".json");setTimeout(function(){URL.revokeObjectURL(u)},2e3);toast("Exported")}window.doExport=doExport;
function csvCell(v){return'"'+String(v==null?"":v).replace(/"/g,'""')+'"'}
function dlCsv(rows,namePrefix,noun){if(rows.length<2){toast("No priced instruments to export");return}var csv=rows.map(function(r){return r.map(csvCell).join(",")}).join("\r\n");var b=new Blob([csv],{type:"text/csv"});var u=URL.createObjectURL(b);triggerDl(u,namePrefix+"-"+dateStr(new Date())+".csv");setTimeout(function(){URL.revokeObjectURL(u)},2e3);toast("Exported "+(rows.length-1)+" "+noun)}
function exportInstruments(){var rows=[["Symbol","Type","Quantity","Currency","Location","Name"]];S.P.forEach(function(a){if(a.type==="stock"||a.type==="option"||a.type==="crypto"){rows.push([a.symbol,a.type,a.quantity,a.currency||"USD",a.location||"",a.displayName||""])}});dlCsv(rows,"vault-instruments","instruments")}window.exportInstruments=exportInstruments;
function exportSymbolsOnly(){var seen={},rows=[["Symbol","Type"]];S.P.forEach(function(a){if((a.type==="stock"||a.type==="option"||a.type==="crypto")&&a.symbol){var sym=a.symbol.toUpperCase(),typ=a.type==="crypto"?"crypto":"stock",key=sym+"|"+typ;if(seen[key])return;seen[key]=true;rows.push([sym,typ])}});rows=[rows[0]].concat(rows.slice(1).sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0}));dlCsv(rows,"vault-symbols","symbols")}window.exportSymbolsOnly=exportSymbolsOnly;
$("impF").addEventListener("change",function(ev){var f=ev.target.files[0];if(!f)return;var reader=new FileReader();reader.onload=function(e){try{var d=JSON.parse(e.target.result);if(applyPayload(d)){applyTheme();save();if(d.snapshots){snapshots=d.snapshots;saveSnaps()}toast("Imported "+S.P.length+" assets");renderAll();refreshAll()}else toast("Invalid file")}catch(err){toast("Error")}};reader.readAsText(f);ev.target.value=""});
$("moX").onclick=closeModal;$("svBtn").onclick=function(){if(S.mIsTxn)saveTxn();else saveAsset()};$("moBg").onclick=function(e){if(e.target===$("moBg"))closeModal()};document.onkeydown=function(e){if(e.key==="Escape")closeModal()};
async function refreshAll(){await refreshPrices();renderAll();await bootstrapHistory();await loadPortfolioChange()}
(async function(){buildNav();var loaded=await load();await loadSnaps();if(!RNGMS[S.rng])S.rng="1M";applyTheme();renderAll();if(loaded&&S.P.length){toast("Loaded "+S.P.length+" assets");await refreshAll()}else{switchTab("manage");await loadPortfolioChange()}})();
})();
